# =====================================================================
# product-service
#
# Contoh LENGKAP satu service "normal": Deployment + Service + HPA.
# Service lain (user, cart, order, payment, notification) memakai pola
# yang sama - cukup ganti nama, port, dan DB_URL.
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shopflow
  labels: { app: product-service, app.kubernetes.io/part-of: shopflow }
spec:
  replicas: 2
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true

      containers:
        - name: product-service
          image: ghcr.io/USERNAME/shopflow-product-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8082 }

          envFrom:
            - configMapRef: { name: shopflow-config }
            - secretRef: { name: shopflow-secrets }

          env:
            - { name: SERVER_PORT, value: "8082" }
            - name: DB_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/shopflow_product"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }

          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits: { memory: "1Gi" }

          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 8"]
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shopflow
spec:
  type: ClusterIP
  selector: { app: product-service }
  ports:
    - { name: http, port: 8082, targetPort: http }
---
# ---------------------------------------------------------------------
# Autoscaling
#
# Catatan penting: produk adalah beban "read-heavy" dan datanya di-cache,
# jadi CPU adalah sinyal yang wajar. Untuk service lain, sinyal yang lebih
# tepat bisa berbeda - misalnya order-service lebih baik di-scale
# berdasarkan kedalaman queue RabbitMQ (butuh KEDA).
# ---------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-service
  namespace: shopflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      # Melambat sengaja: menurunkan replika terlalu cepat saat trafik naik-turun
      # menyebabkan "flapping" dan membuat cache lokal selalu dingin.
      stabilizationWindowSeconds: 300
---
# Jamin replika minimum tetap tersedia saat node di-drain untuk maintenance.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: product-service
  namespace: shopflow
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: product-service }
