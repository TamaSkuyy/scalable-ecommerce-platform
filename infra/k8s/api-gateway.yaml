# =====================================================================
# api-gateway
#
# SATU-SATUNYA service yang boleh dijangkau dari luar cluster
# (lihat ingress.yaml + NetworkPolicy di roadmap).
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shopflow
  labels: { app: api-gateway, app.kubernetes.io/part-of: shopflow }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true

      containers:
        - name: api-gateway
          image: ghcr.io/USERNAME/shopflow-api-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }

          envFrom:
            - configMapRef: { name: shopflow-config }
            - secretRef: { name: shopflow-secrets, optional: false }

          env:
            - { name: SERVER_PORT, value: "8080" }

          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }

          resources:
            requests: { memory: "384Mi", cpu: "200m" }
            limits: { memory: "768Mi" }

          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3

          # Spring Boot sudah dikonfigurasi `server.shutdown: graceful`
          # (timeout 20s). preStop memberi waktu rule iptables/Kubernetes
          # menyebar supaya pod berhenti menerima trafik baru SEBELUM
          # proses benar-benar dimatikan. Tanpa ini, user melihat 502
          # di setiap deploy.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 8"]
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shopflow
spec:
  type: ClusterIP
  selector: { app: api-gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
