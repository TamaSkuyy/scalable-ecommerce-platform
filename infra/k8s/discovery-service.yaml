# =====================================================================
# discovery-service (Eureka)
#
# Service registry: seluruh service lain akan menunjuk ke sini lewat
# EUREKA_URL=http://discovery-service:8761/eureka/
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: shopflow
  labels: { app: discovery-service, app.kubernetes.io/part-of: shopflow }
spec:
  replicas: 1
  selector:
    matchLabels: { app: discovery-service }
  template:
    metadata:
      labels: { app: discovery-service }
    spec:
      # Beri waktu instance untuk mengirim shutdown ke Eureka & request selesai.
      terminationGracePeriodSeconds: 45

      securityContext:
        runAsNonRoot: true

      containers:
        - name: discovery-service
          image: ghcr.io/USERNAME/shopflow-discovery-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8761 }

          envFrom:
            - configMapRef: { name: shopflow-config }

          env:
            - { name: SERVER_PORT, value: "8761" }
            - { name: EUREKA_HOSTNAME, value: "discovery-service" }

          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }

          # ------------------------------------------------------------------
          # TIDAK ada CPU limit. Ini keputusan sadar:
          # JVM memakai jumlah CPU yang tersedia untuk menghitung jumlah thread GC
          # dan compiler JIT. Dengan CPU limit rendah, startup bisa 10x lebih
          # lambat dan GC jadi tidak efisien. Batasi MEMORI, biarkan CPU request
          # yang mengatur penjadwalan.
          # ------------------------------------------------------------------
          resources:
            requests: { memory: "384Mi", cpu: "150m" }
            limits: { memory: "768Mi" }

          # JVM butuh waktu untuk start; startupProbe mencegah liveness membunuhnya.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: shopflow
spec:
  type: ClusterIP
  selector: { app: discovery-service }
  ports:
    - { name: http, port: 8761, targetPort: http }
