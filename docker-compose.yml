# =====================================================================
# ShopFlow - orkestrasi development lokal
#
#   docker compose up -d --build           # infrastruktur + 8 service backend
#   docker compose --profile frontend up   # + Next.js (build lambat)
#   docker compose logs -f order-service
#
# Titik akses:
#   API Gateway    http://localhost:8080
#   Eureka UI      http://localhost:8761
#   RabbitMQ UI    http://localhost:15672  (shopflow / shopflow)
#   Prometheus     http://localhost:9090
#   Grafana        http://localhost:3001   (admin / admin)
#   Frontend       http://localhost:3000   (jalankan `pnpm dev` di host)
#
# CATATAN KEAMANAN: port service individual SENGAJA tidak dipublikasikan ke
# host. Hanya API Gateway yang boleh diakses dari luar - supaya header
# internal X-User-Id / X-Internal-Token tidak bisa dipalsukan dari luar.
# =====================================================================

name: shopflow

# ---------------------------------------------------------------------
# Anchor (potongan konfigurasi yang dipakai berulang)
# ---------------------------------------------------------------------
x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-backend-env: &backend-env
  EUREKA_URL: http://discovery-service:8761/eureka/
  DB_USER: ${POSTGRES_USER:-shopflow}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-shopflow}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-shopflow}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-shopflow}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWT_SECRET: ${JWT_SECRET:-shopflow-development-secret-key-change-me-32chars}
  JWT_ISSUER: ${JWT_ISSUER:-shopflow-identity}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-shopflow-internal-dev-token}
  TZ: Asia/Jakarta

x-backend-service: &backend-service
  restart: unless-stopped
  networks: [shopflow-net]

x-deps-discovery: &deps-discovery
  discovery-service:
    condition: service_healthy

x-deps-db: &deps-db
  discovery-service:
    condition: service_healthy
  postgres:
    condition: service_healthy

x-deps-db-mq: &deps-db-mq
  discovery-service:
    condition: service_healthy
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

x-deps-cart: &deps-cart
  discovery-service:
    condition: service_healthy
  redis:
    condition: service_healthy

services:

  # ===================================================================
  # INFRASTRUKTUR
  # ===================================================================

  postgres:
    image: postgres:17-alpine
    container_name: shopflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopflow}
      POSTGRES_DB: shopflow
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopflow} -d shopflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [shopflow-net]

  redis:
    image: redis:7-alpine
    container_name: shopflow-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [shopflow-net]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: shopflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shopflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shopflow}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
      - "15692:15692"   # Metrik Prometheus
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [shopflow-net]

  # ===================================================================
  # DISCOVERY & GATEWAY
  # ===================================================================

  discovery-service:
    <<: *backend-service
    container_name: shopflow-discovery
    build:
      <<: *backend-build
      args:
        MODULE: discovery-service
    environment:
      <<: *backend-env
      SERVER_PORT: 8761
      EUREKA_HOSTNAME: discovery-service
    ports:
      - "8761:8761"     # Eureka dashboard (development only)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s

  api-gateway:
    <<: *backend-service
    container_name: shopflow-gateway
    build:
      <<: *backend-build
      args:
        MODULE: api-gateway
    environment:
      <<: *backend-env
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on: *deps-discovery

  # ===================================================================
  # CORE SERVICES (port TIDAK dipublikasikan - hanya lewat Gateway)
  # ===================================================================

  user-service:
    <<: *backend-service
    container_name: shopflow-user
    build:
      <<: *backend-build
      args:
        MODULE: user-service
    environment:
      <<: *backend-env
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/shopflow_user
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@shopflow.dev}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin12345}
    depends_on: *deps-db

  product-service:
    <<: *backend-service
    container_name: shopflow-product
    build:
      <<: *backend-build
      args:
        MODULE: product-service
    environment:
      <<: *backend-env
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/shopflow_product
    depends_on: *deps-db

  cart-service:
    <<: *backend-service
    container_name: shopflow-cart
    build:
      <<: *backend-build
      args:
        MODULE: cart-service
    environment:
      <<: *backend-env
      SERVER_PORT: 8083
    depends_on: *deps-cart

  order-service:
    <<: *backend-service
    container_name: shopflow-order
    build:
      <<: *backend-build
      args:
        MODULE: order-service
    environment:
      <<: *backend-env
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/shopflow_order
    depends_on: *deps-db-mq

  payment-service:
    <<: *backend-service
    container_name: shopflow-payment
    build:
      <<: *backend-build
      args:
        MODULE: payment-service
    environment:
      <<: *backend-env
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/shopflow_payment
      SHOPFLOW_PAYMENT_SUCCESS_RATE: ${SHOPFLOW_PAYMENT_SUCCESS_RATE:-0.9}
    depends_on: *deps-db-mq

  notification-service:
    <<: *backend-service
    container_name: shopflow-notification
    build:
      <<: *backend-build
      args:
        MODULE: notification-service
    environment:
      <<: *backend-env
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/shopflow_notification
    depends_on: *deps-db-mq

  # ===================================================================
  # FRONTEND (profil `frontend`; untuk sehari-hari lebih cepat `pnpm dev`)
  # ===================================================================

  web:
    profiles: ["frontend"]
    container_name: shopflow-web
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://api-gateway:8080
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api-gateway:8080
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
      discovery-service:
        condition: service_healthy
    networks: [shopflow-net]

  # ===================================================================
  # OBSERVABILITY
  # ===================================================================

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: shopflow-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks: [shopflow-net]

  grafana:
    image: grafana/grafana:12.2.0
    container_name: shopflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3000"
    ports:
      - "3001:3000"     # 3000 dipakai Next.js
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    networks: [shopflow-net]

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

networks:
  shopflow-net:
    driver: bridge
