server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopflow_order}
    username: ${DB_USER:shopflow}
    password: ${DB_PASSWORD:shopflow}
    hikari:
      pool-name: order-service-pool
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:shopflow}
    password: ${RABBITMQ_PASSWORD:shopflow}
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: auto
        # Pesan yang gagal setelah semua retry -> dead-letter queue, bukan requeue tanpa henti.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  cloud:
    openfeign:
      # JANGAN aktifkan. Kalau `enabled: true`, Spring Cloud membungkus setiap
      # panggilan Feign dengan TimeLimiter BAWAAN 1 detik dan exception aslinya
      # berubah menjadi NoFallbackAvailableException("No fallback available.").
      # Circuit breaker kita dipasang via @CircuitBreaker pada CartGateway /
      # CatalogGateway. Penjelasan lengkap: cart-service/src/main/resources/application.yml.
      circuitbreaker:
        enabled: false
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: basic

resilience4j:
  circuitbreaker:
    instances:
      productService:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.shopflow.common.api.ResourceNotFoundException
          - com.shopflow.common.api.ConflictException
          - com.shopflow.common.api.BadRequestException
      cartService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  # Tidak ada blok `timelimiter` - lihat penjelasan di cart-service/application.yml.
  # Timeout diatur oleh connectTimeout/readTimeout Feign di atas.

shopflow:
  internal:
    token: ${INTERNAL_API_TOKEN:shopflow-internal-dev-token}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
