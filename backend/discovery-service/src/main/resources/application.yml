server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: discovery-service

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Server Eureka tidak perlu mendaftar ke dirinya sendiri.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # ------------------------------------------------------------------
    # HANYA UNTUK DEVELOPMENT.
    # Self-preservation mencegah Eureka menghapus instance hanya karena
    # heartbeat telat (bagus di produksi, menyakitkan saat ngoding karena
    # service yang sudah mati tetap muncul). Aktifkan lagi di produksi.
    # ------------------------------------------------------------------
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
