server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: product-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopflow_product}
    username: ${DB_USER:shopflow}
    password: ${DB_PASSWORD:shopflow}
    hikari:
      pool-name: product-service-pool
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=120s

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

shopflow:
  internal:
    # Dipakai service lain untuk memanggil /api/v1/internal/**. Ganti di produksi!
    token: ${INTERNAL_API_TOKEN:shopflow-internal-dev-token}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.shopflow: INFO
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
